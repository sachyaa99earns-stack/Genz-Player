    <!-- Spotify IFrame API -->
    <script src="https://open.spotify.com/embed/iframe-api/v1" async></script>
    <script>
        // GenZ Quotes List in Hinglish
        const quotes = [
            "Ekdum main character waali feeling ✨",
            "Vibe check: Ekdum kadak 💅",
            "Bhai kya aesthetic vibe hai 🤌",
            "Dil me rent-free reh raha hai yeh track 🎧",
            "Bawaal track hai bhidu 🤯",
            "No cap, yeh gaana fire hai 🔥",
            "POV: Tu apni life romanticize kar raha hai ☕",
            "It's giving sukkoon 😌",
            "Apna villain era shuru 😈",
            "W song, W vibe 🏆"
        ];

        let currentQuoteIndex = 0;
        const quoteElement = document.getElementById('genz-quote');

        // Start with the first quote
        quoteElement.innerText = quotes[0];

        function changeQuote() {
            quoteElement.style.opacity = 0;
            setTimeout(() => {
                currentQuoteIndex = (currentQuoteIndex + 1) % quotes.length;
                quoteElement.innerText = quotes[currentQuoteIndex];
                quoteElement.style.opacity = 1;
            }, 400); // Wait for fade out
        }

        // Spotify API setup
        window.onSpotifyIframeApiReady = (IFrameAPI) => {
            const element = document.getElementById('embed-iframe');
            const options = {
                width: '100%',
                height: '80',
                // User's Spotify playlist
                uri: 'spotify:playlist:0J2Io2I47rfYsdir02OA3i',
                theme: '0' // Dark theme
            };
            
            const callback = (EmbedController) => {
                let lastPosition = 0;
                let lastDuration = 0;

                EmbedController.addListener('playback_update', e => {
                    if (e.data) {
                        const currentPosition = e.data.position;
                        const currentDuration = e.data.duration;

                        // Hide login hint if full track is playing (>31s)
                        if (currentDuration > 31000) {
                            const loginHint = document.getElementById('spotify-login-hint');
                            if(loginHint) loginHint.style.opacity = '0';
                        }

                        // Show track info if available
                        if (e.data.track) {
                            const trackName = e.data.track.name || e.data.track.title || null;
                            const artistName = e.data.track.artists 
                                ? e.data.track.artists.map(a => a.name).join(', ') 
                                : (e.data.track.artist || null);

                            if (trackName) {
                                document.getElementById('track-name').innerText = trackName;
                                document.getElementById('track-info').style.opacity = 1;
                            }
                            if (artistName) {
                                document.getElementById('track-artist').innerText = artistName;
                            }
                        }

                        // Method 1: Duration changed (new song loaded with different length)
                        const durationChanged = (currentDuration > 0 && lastDuration > 0 && currentDuration !== lastDuration);
                        
                        // Method 2: Position jumped back to the start (user skipped to next/prev song)
                        const songRestarted = (currentPosition < 3000 && lastPosition > 10000);

                        if (durationChanged || songRestarted) {
                            changeQuote();
                        }

                        lastPosition = currentPosition;
                        if (currentDuration > 0) {
                            lastDuration = currentDuration;
                        }
                    }
                });
            };
            
            IFrameAPI.createController(element, options, callback);
        };

        // Clock functionality
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 || 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('clock').innerText = hours + ':' + minutes + ' ' + ampm;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Horn functionality
        const hornBtn = document.getElementById('horn');
        if (hornBtn) {
            hornBtn.addEventListener('click', () => {
                hornBtn.classList.add('is-blaring');
                changeQuote();
                setTimeout(() => {
                    hornBtn.classList.remove('is-blaring');
                }, 720);
            });
        }
    </script>

    <!-- Firebase Realtime Presence Tracking -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            databaseURL: "https://genz-player-s-default-rtdb.asia-southeast1.firebasedatabase.app"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Generate a unique ID for this session
        const userId = Math.random().toString(36).substr(2, 9);
        const userRef = db.ref('presence/' + userId);

        // Add user to presence when connected
        db.ref('.info/connected').on('value', (snap) => {
            if (snap.val() === true) {
                // Remove on disconnect
                userRef.onDisconnect().remove();
                // Set presence
                userRef.set(true);
            }
        });

        // Listen to total count and update display
        db.ref('presence').on('value', (snap) => {
            const count = snap.numChildren();
            document.getElementById('listeners').innerText = count;
        });

        // Vibe Board Logic
        const vibeBtn = document.getElementById('vibe-btn');
        const vibeBoard = document.getElementById('vibe-board');
        vibeBtn.addEventListener('click', () => {
            vibeBoard.style.display = vibeBoard.style.display === 'none' || vibeBoard.style.display === '' ? 'flex' : 'none';
        });

        const vibesRef = db.ref('experiences');
        const vibeName = document.getElementById('vibe-name');
        const vibeExp = document.getElementById('vibe-exp');
        const sendVibeBtn = document.getElementById('send-vibe');
        const vibeList = document.getElementById('vibe-list');
        const floatLayer = document.getElementById('float-layer');

        // Always start from top-left corner
        let lastLane = -1;

        function spawnFloat(name, exp) {
            const el = document.createElement('div');
            const left = Math.random() * 3; // 0-3% from left edge (basically corner)
            const duration = 14 + Math.random() * 8; // 14-22s (slow)
            const driftX = 30 + Math.random() * 20; // slight rightward drift

            el.style.cssText = `
                position: absolute;
                top: -5%;
                left: ${left}%;
                white-space: nowrap;
                font-family: ui-sans-serif, sans-serif;
                font-size: 0.82rem;
                color: rgba(255,255,255,0.7);
                text-shadow: 0 1px 6px rgba(0,0,0,0.8);
                will-change: transform;
                pointer-events: none;
            `;
            el.innerHTML = `<span style="color:rgba(255,120,120,0.9);font-weight:700;">${name}</span>: ${exp}`;
            floatLayer.appendChild(el);

            // Animate: top-left → bottom with slight rightward drift
            const anim = el.animate([
                { transform: 'translate(0, 0)', opacity: 0.8 },
                { transform: `translate(${driftX}px, 108vh)`, opacity: 0 }
            ], {
                duration: duration * 1000,
                easing: 'linear',
                fill: 'forwards'
            });
            anim.onfinish = () => el.remove();
        }

        // Only spawn floats for NEW entries (after page load)
        let initialLoad = true;
        setTimeout(() => { initialLoad = false; }, 3000);

        function sendVibe() {
            const name = vibeName.value.trim();
            const exp = vibeExp.value.trim();
            if(name && exp) {
                vibesRef.push({
                    name: name,
                    exp: exp,
                    time: firebase.database.ServerValue.TIMESTAMP
                });
                vibeExp.value = ''; // keep name, clear exp
                // Close board after sending
                vibeBoard.style.display = 'none';
            }
        }
        
        sendVibeBtn.addEventListener('click', sendVibe);

        vibesRef.orderByChild('time').limitToLast(20).on('child_added', (snap) => {
            const vibe = snap.val();
            if (!initialLoad) {
                spawnFloat(vibe.name || 'Anon', vibe.exp || '');
            }
        });

        // Load all comments and loop them continuously — all at once
        let allVibes = [];
        let loopInterval = null;

        function startLoop() {
            if (allVibes.length === 0) return;
            // Spawn all at once
            allVibes.forEach(v => spawnFloat(v.name || 'Anon', v.exp || ''));
            // Repeat after 18s (matches float duration)
            loopInterval = setInterval(() => {
                allVibes.forEach(v => spawnFloat(v.name || 'Anon', v.exp || ''));
            }, 18000);
        }

        vibesRef.orderByChild('time').limitToLast(20).once('value', (snap) => {
            snap.forEach(child => allVibes.push(child.val()));
            startLoop();
        });
    </script>
